services:
  db:
    image: postgres:17-alpine
    container_name: miniledger-db
    # Start again automatically whenever Docker Desktop starts (unless we stopped it ourselves).
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger
      POSTGRES_DB: miniledger
    ports:
      # Laptop port 5433 -> container port 5432 (a local Postgres already uses 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start, to create the database the tests use
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger -d miniledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
