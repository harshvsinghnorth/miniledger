# docker compose up -d                        -> just Postgres (for `npm run dev` on the laptop)
# docker compose --profile app up --build     -> Postgres + the API in a container

services:
  db:
    image: postgres:17-alpine
    container_name: miniledger-db
    # Start again automatically whenever Docker Desktop starts (unless we stopped it ourselves).
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger
      POSTGRES_DB: miniledger
    ports:
      # Laptop port 5433 -> container port 5432 (a local Postgres already uses 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start, to create the database the tests use
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger -d miniledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    container_name: miniledger-api
    profiles: ["app"] # only started with --profile app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections
    environment:
      # Inside Docker's network the database is reachable by its service name, "db".
      DATABASE_URL: postgresql://miniledger:miniledger@db:5432/miniledger
      HOST: 0.0.0.0
      PORT: 3000
      # Local-only defaults so this runs out of the box. Set real values in the shell
      # (or a .env file next to this one) for anything beyond a laptop.
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-jwt-secret-change-me-0123456789}
      OTP_SECRET: ${OTP_SECRET:-local-docker-only-otp-secret-change-me-0123456789}
    ports:
      - "3000:3000"
    volumes:
      - receipts:/app/uploads # receipt photos survive container rebuilds

volumes:
  pgdata:
  receipts:
